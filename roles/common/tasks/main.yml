- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install common dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - unzip
      - git
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Set locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Remove useless packages
  ansible.builtin.apt:
    autoremove: true
    purge: true
